name: Deploy Duqra school website
on:
  push:
    branches: [main]
    paths: ['duqra-school.zip', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract application source
        run: unzip -q duqra-school.zip
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: duqra-school/pnpm-lock.yaml
      - uses: actions/configure-pages@v5
      - name: Install dependencies
        run: pnpm --dir duqra-school install --frozen-lockfile
      - name: Run tests
        run: pnpm --dir duqra-school test
      - name: Build website
        run: pnpm --dir duqra-school build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: duqra-school/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
